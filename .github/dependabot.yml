# Mises à jour mensuelles des dépendances npm (frontend, backend) et des
# GitHub Actions, regroupées par famille pour limiter le nombre de PR. Les
# mises à jour de sécurité, si elles sont activées sur le dépôt, ne suivent
# pas ce calendrier.
#
# Une dépendance rejoint le premier groupe qui la correspond : « misc » (*)
# doit rester en dernier. Il est limité à minor/patch, donc une version
# majeure d'une bibliothèque non groupée donne une PR isolée.
#
# Doc : https://docs.github.com/en/code-security/dependabot

version: 2

updates:
  # ─────────────── Frontend ───────────────
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      next:
        patterns:
          - "next"
          - "@next/*"
          - "eslint-config-next"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      typescript:
        patterns:
          - "typescript"
          - "@types/*"
      tooling:
        patterns:
          - "eslint*"
          - "prettier*"
      # Catch-all : tailwindcss, tailwind-merge, @phosphor-icons, etc.
      # → une seule PR groupée. DOIT rester en dernier.
      misc:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ─────────────── Backend ────────────────
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      prisma:
        patterns:
          - "prisma"
          - "@prisma/*"
      typescript:
        patterns:
          - "typescript"
          - "@types/*"
      express:
        patterns:
          - "express"
          - "@types/express"
          - "cookie-parser"
          - "@types/cookie-parser"
          - "cors"
          - "@types/cors"
          - "helmet"
          - "@types/helmet"
      tooling:
        patterns:
          - "tsx"
          - "prettier*"
          - "ts-node"
          - "vitest"
          - "@vitest/*"
      # Catch-all : stripe, zod, pino, resend, node-cron, etc.
      # → une seule PR groupée. DOIT rester en dernier.
      misc:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ─────────────── GitHub Actions ─────────
  # Actions utilisées par la CI (.github/workflows).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
